<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fa;
    --panel: rgba(255, 255, 255, .88);
    --panel2: #f7f8fb;
    --line: #e2e7f0;
    --line2: #d3dbe9;
    --text: #262b45;
    --muted: #767b98;
    --dim: #a3a7bd;
    --accent: #1f3a68;
    --accent-soft: #e3eaf5;
    --mint: #5fc9a8;
    --lilac: #3d5f94;
    --rose: #f07d9c;
    --sky: #6aaee8;
    --green: #4cbf7f;
    --orange: #f59a5b;
    --amber: #c98a12;
    --gold: #d9a520;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --head: "Inter Tight", Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Pas de défilement interne : Streamlit ajuste la hauteur de l'iframe au contenu. */
  html, body { margin: 0; overflow: hidden; color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
  body {
    background:
      radial-gradient(900px 420px at 88% -10%, rgba(150, 175, 215, .32), transparent 65%),
      radial-gradient(760px 420px at -6% 108%, rgba(160, 228, 206, .32), transparent 60%),
      var(--bg);
  }
  /* Visibilité selon la vue et le mode */
  body:not(.view-home) .only-home, body:not(.view-sandbox) .only-sandbox, body:not(.view-race) .only-race,
  body:not(.mode-beginner) .only-beginner, body:not(.mode-expert) .only-expert { display: none !important; }

  .app { position: relative; max-width: none; margin: 0 auto; padding: 4px 4px 8px; display: flex; flex-direction: column; gap: 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(25, 45, 85, .04), 0 8px 24px rgba(25, 45, 85, .05); }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 10px; margin: 0 0 8px; white-space: nowrap; }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); }
  .eyebrow b { color: var(--dim); font-weight: 500; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  kbd { font-family: var(--mono); font-size: 10.5px; display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 5px;
    background: #fff; border: 1px solid var(--line2); border-bottom-width: 2px; color: var(--text); }

  /* ---------- Barre du haut ---------- */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 2px 2px 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; cursor: pointer; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, #9fb4d6, var(--accent)); box-shadow: 0 6px 18px rgba(31, 58, 104, .3); }
  .brand-txt b { font-family: var(--head); font-size: 16px; letter-spacing: .02em; display: block; line-height: 1.05; }
  .brand-txt b span { color: var(--accent); }
  .brand-txt small { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 999px; padding: 3px; background: #fff; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; transition: background .2s, color .2s; white-space: nowrap; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(31, 58, 104, .35); }
  .seg.small button { padding: 4px 9px; font-size: 9.5px; }
  .btn { border: 1px solid var(--line2); background: #fff; border-radius: 9px; padding: 6px 11px; font-size: 12px; font-weight: 500; transition: background .15s, border-color .15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--accent-soft); border-color: rgba(31, 58, 104, .5); }
  .btn.primary { background: linear-gradient(135deg, #5a7cb3, var(--accent)); border-color: transparent; color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.big { padding: 10px 18px; font-size: 14px; border-radius: 11px; }
  .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player { font-family: var(--mono); font-size: 11px; color: #2f8f72; display: inline-flex; align-items: center; gap: 6px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); flex: none; }

  /* ---------- Scène 3D partagée (accueil + traversée) ---------- */
  .world { position: relative; overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: #cfdde8; }
  .world > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero-slot .world { aspect-ratio: 2.9 / 1; min-height: 300px; }
  .race-slot .world { height: var(--race-h, 56vw); min-height: 420px; }   /* hauteur ajustée à l'écran par fitRace() */
  .glass { background: rgba(255, 255, 255, .74); border: 1px solid rgba(255, 255, 255, .9); border-radius: 11px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 16px rgba(25, 40, 75, .1); }
  .hero-text { position: absolute; left: 22px; bottom: 20px; max-width: min(560px, 60%); padding: 16px 18px; }
  .hero-text h1 { margin: 0 0 6px; font-family: var(--head); font-size: clamp(24px, 3vw, 38px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .hero-text h1 em { font-style: normal; color: #1d4f91; }
  .spacepop { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 12px; padding: 14px 22px; z-index: 4; pointer-events: none;
    font-family: var(--head); font-size: 20px; font-weight: 700; color: var(--text); animation: spacepulse 1.4s ease-in-out infinite; }
  .spacepop kbd { min-width: 120px; height: 34px; font-size: 14px; box-shadow: 0 3px 0 #b9c3d6; }
  @keyframes spacepulse { 50% { transform: translate(-50%, -50%) scale(1.04); } }
  .hero-text p { margin: 0 0 12px; color: #4a4f6c; line-height: 1.5; font-size: 13.5px; }

  /* HUD de course (incrustations) */
  .hud-tl { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 60%; pointer-events: none; }
  .chip { padding: 6px 10px; min-width: 86px; }
  .chip small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .chip b { font-family: var(--mono); font-size: 16px; font-weight: 600; white-space: nowrap; }
  .chip b i { font-style: normal; font-size: 10px; color: var(--muted); font-weight: 400; margin-left: 3px; }
  .chip.big b { font-size: 24px; }
  .hud-tr { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 3; }
  .tools { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .tool { padding: 5px 8px; font-size: 11px; font-weight: 500; display: inline-flex; gap: 5px; align-items: center; }
  .tool kbd { min-width: 18px; height: 17px; font-size: 9.5px; }
  .tool.on { color: var(--accent); }
  .minimap { width: 230px; height: 150px; display: block; }
  .progress-top { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: min(420px, 34%); padding: 7px 12px; pointer-events: none; }
  .progress-top .track { position: relative; height: 6px; border-radius: 99px; background: rgba(38, 43, 69, .1); margin-top: 4px; }
  .progress-top .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--mint), var(--lilac)); }
  .progress-top .row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .bigcount { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: var(--head); font-size: 110px; font-weight: 800; color: #fff; text-shadow: 0 6px 30px rgba(25, 45, 85, .45); pointer-events: none; animation: pop .6s ease-out; z-index: 4; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .kwarn { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font-family: var(--head); font-size: 24px; font-weight: 800; padding: 10px 18px; pointer-events: none; z-index: 3; text-align: center; }
  .kwarn.over { color: #d04a6c; animation: blink .5s steps(2) infinite; }
  .kwarn small { display: block; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }
  @keyframes blink { 50% { opacity: .35; } }
  /* Commandes à la souris */
  .throttle { position: absolute; left: 14px; bottom: 16px; width: 64px; height: 190px; padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; touch-action: none; z-index: 3; }
  .throttle small, .helm small, .kitebox small { font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .throttle .rail { position: relative; flex: 1; width: 18px; border-radius: 9px; background: linear-gradient(0deg, #f6a6bd 0 18%, #e2e7f0 18% 22%, #bfeee0 22%); cursor: ns-resize; }
  .throttle .knob { position: absolute; left: 50%; width: 40px; height: 16px; margin: -8px 0 0 -20px; border-radius: 6px; background: #fff; border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(25, 45, 85, .25); }
  .throttle b { font-family: var(--mono); font-size: 12px; }
  .helm { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(380px, 40%); padding: 6px 12px 8px; text-align: center; touch-action: none; z-index: 3; }
  .helm .rail { position: relative; height: 16px; margin-top: 4px; border-radius: 8px; background: linear-gradient(90deg, #cfe0f5, #f1f3f9 50%, #cfe0f5); cursor: ew-resize; }
  .helm .rail::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--dim); }
  .helm .knob { position: absolute; top: 50%; width: 30px; height: 24px; margin: -12px 0 0 -15px; border-radius: 7px; background: #fff; border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(25, 45, 85, .25); }
  .kitebox { position: absolute; right: 14px; bottom: 16px; width: 232px; padding: 8px 10px; z-index: 3; }
  .kitebox .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; font-size: 11.5px; }
  .kitebox .bar { position: relative; height: 8px; border-radius: 4px; background: #eceff5; overflow: hidden; flex: 1; }
  .kitebox .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
  .kitebtn { width: 100%; margin-top: 6px; justify-content: center; }
  .kitebox .rig { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; }
  .kitebox .rig .seg { padding: 2px; }
  .kitebox .rig .seg button { padding: 3px 6px; font-size: 9px; letter-spacing: .02em; text-transform: none; }
  .dash { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; padding: 6px; }
  .inst { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 10px; min-width: 0; border: 1px solid rgba(255, 255, 255, .8); }
  .inst canvas { width: 46px; height: 46px; flex: none; display: block; }
  .inst .tx { min-width: 0; }
  .inst small, .inst b, .inst em { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inst small { font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .inst b { font-family: var(--mono); font-size: 13.5px; font-weight: 600; }
  .inst em { font-style: normal; font-size: 10px; color: var(--muted); }
  .t-lilac { background: linear-gradient(135deg, #eef2f9, #e3eaf5); } .t-mint { background: linear-gradient(135deg, #effaf5, #e1f5ec); }
  .t-sky { background: linear-gradient(135deg, #eff5fc, #e2edf9); } .t-peach { background: linear-gradient(135deg, #fff4ec, #fde8dc); }
  .t-sand { background: linear-gradient(135deg, #fefaea, #fbf1d3); } .t-rose { background: linear-gradient(135deg, #fff0f4, #fce2ea); }
  .t-grey { background: linear-gradient(135deg, #f6f7fa, #eeedf5); }
  @media (max-width: 1350px) { .dash { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

  .toasts { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 20; width: min(480px, 90%); }
  .toast { padding: 8px 14px; font-size: 12.5px; font-weight: 500; animation: tin .25s ease-out; text-align: center; }
  .toast.good { border-color: #9fdcbc; color: #23704a; }
  .toast.warn { border-color: #f3d27e; color: #8a5c00; }
  .toast.bad { border-color: #f5a9bd; color: #b23a5c; }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  /* ---------- Accueil ---------- */
  .home-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 2fr); gap: 10px; }
  .vision { padding: 14px 16px; }
  .vision p { margin: 0 0 8px; line-height: 1.55; color: #4a4f6c; font-size: 12.5px; }
  .vision ul { margin: 4px 0 0; padding-left: 18px; color: #4a4f6c; line-height: 1.55; font-size: 12.5px; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .card { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .card h3 { margin: 0; font-family: var(--head); font-size: 17px; font-weight: 700; }
  .card .tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .card p { margin: 0; color: #4a4f6c; font-size: 12.5px; line-height: 1.5; flex: 1; }
  .card canvas { width: 100%; height: 86px; display: block; border-radius: 10px; }
  .card .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .boards { padding: 12px 14px; }
  .board-tabs { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
  .board-scroll { max-height: 300px; overflow: auto; }
  table.board th.sorted, table.board td.sorted { color: var(--accent); font-weight: 700; }
  table.board td:nth-child(2) { white-space: normal; }
  .board-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 180px; }
  .podium .step { width: 30%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; }
  .podium .block { width: 100%; border-radius: 10px 10px 4px 4px; display: grid; place-items: center; font-family: var(--head); font-weight: 800; font-size: 22px; color: #fff; }
  .podium .p1 .block { height: 96px; background: linear-gradient(180deg, #f5d36b, #d9a520); }
  .podium .p2 .block { height: 70px; background: linear-gradient(180deg, #d9dce6, #a5abbd); }
  .podium .p3 .block { height: 54px; background: linear-gradient(180deg, #f0b98d, #c47a45); }
  .podium .who { font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium .t { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  table.board { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.board th { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--line2); }
  table.board td { padding: 4px 6px; border-bottom: 1px solid var(--line); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.board td.n, table.board th.n { text-align: right; font-family: var(--mono); }
  table.board tr.me td { background: var(--accent-soft); }
  .dist { width: 100%; height: 170px; display: block; }
  .board-src { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .04em; }

  /* ---------- Bac à sable (mise en page historique) ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 350px; grid-template-areas: "stage side" "ctrl side"; gap: 10px; }
  .stage { grid-area: stage; position: relative; overflow: hidden; aspect-ratio: 2.3 / 1; min-height: 340px; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .side { grid-area: side; display: flex; flex-direction: column; gap: 10px; }
  .controls { grid-area: ctrl; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 14px; align-items: center; }
  .controls > .eyebrow { grid-column: 1 / -1; margin: 0; }
  .analysis { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, .78fr); gap: 10px; }
  .hud { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 56%; pointer-events: none; }
  .mission { position: absolute; right: 12px; bottom: 12px; width: min(310px, 44%); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .mission.done { border-color: var(--green); }
  .mission .eyebrow { margin: 0; }
  .mission h3 { margin: 0; font-family: var(--head); font-size: 14px; font-weight: 600; }
  .mission p { margin: 0; font-size: 11.5px; line-height: 1.45; color: #4a4f6c; }
  .mission-nav { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .mission-nav button { border: 1px solid var(--line2); background: #fff; border-radius: 6px; padding: 3px 8px; font-size: 11px; }
  .pill { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; background: #fff3d6; color: var(--amber); }
  .mission.done .pill { background: #dcf5e7; color: #2f8f5c; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #d7dde8; }
  .dot.active { box-shadow: 0 0 0 2px var(--accent); }
  .dot.won { background: var(--green); }
  .kite-state { position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; pointer-events: none; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(76, 191, 127, .2); flex: none; }
  .off .led { background: var(--rose); box-shadow: 0 0 0 3px rgba(240, 125, 156, .2); }
  .compass-panel { padding: 10px 12px; }
  .compass-wrap { display: grid; grid-template-columns: 158px minmax(0, 1fr); gap: 10px; align-items: center; }
  .compass-cv { width: 158px; height: 158px; display: block; }
  .legend { display: flex; flex-direction: column; gap: 7px; font-size: 11px; color: #4a4f6c; }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .legend i { width: 16px; height: 3px; border-radius: 2px; flex: none; }
  .legend em { font-style: normal; font-family: var(--mono); color: var(--text); margin-left: auto; font-size: 11px; }
  .gauges { padding: 10px 12px; }
  .gauge-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .gauge { text-align: center; }
  .gauge canvas { width: 100%; aspect-ratio: 1.6 / 1; display: block; }
  .g-val { font-family: var(--mono); font-size: 16px; font-weight: 600; margin-top: -4px; }
  .g-lab { font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .g-sub { font-size: 10.5px; color: #5a5f7c; min-height: 2.7em; line-height: 1.3; margin-top: 1px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { padding: 8px 11px; }
  .kpi small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .kpi b { font-family: var(--mono); font-size: 18px; font-weight: 600; display: block; margin-top: 1px; white-space: nowrap; }
  .kpi em { font-style: normal; font-family: var(--mono); font-size: 10.5px; }
  .up { color: #d04a6c; } .down { color: #2f9f66; } .flat { color: var(--muted); }
  .knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; }
  .knob { display: flex; flex-direction: column; align-items: center; gap: 1px; user-select: none; -webkit-user-select: none; position: relative; }
  .knob svg { width: 84px; height: 84px; cursor: grab; touch-action: none; outline: none; border-radius: 50%; overflow: visible; }
  .knob svg:focus-visible { box-shadow: 0 0 0 3px rgba(31, 58, 104, .4); }
